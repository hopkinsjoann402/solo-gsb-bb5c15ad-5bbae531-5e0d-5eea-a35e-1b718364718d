services:
  booklet-api:
    build: .
    image: booklet-imposition-api:latest
    container_name: booklet-imposition-api
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。宿主机端口可用环境变量 HOST_PORT 修改。
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      # 允许的最大总页数, 超过返回 400
      MAX_TOTAL_PAGES: ${MAX_TOTAL_PAGES:-100000}
    healthcheck:
      # 不依赖 curl, 直接用 Python 标准库探活
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
